StylesPath = styles
MinAlertLevel = suggestion
Vocab = Blog
Packages = write-good, proselint

[formats]
qmd = md

[*.{md,qmd}]
BasedOnStyles = Vale, write-good, proselint, Blog

# Skip inline and display math
TokenIgnores = (\$[^\n$]+\$)
BlockIgnores = (?s)(\$\$.*?\$\$)

# Hedging is good epistemics, not weakness
proselint.Hedging = NO
write-good.Weasel = NO

# Too strict for technical or conversational writing
write-good.E-Prime = NO
write-good.So = NO
proselint.But = NO

# Replaced by Blog.Wordiness (cleaner list)
write-good.TooWordy = NO

# Passive voice is sometimes the clearest option; keep as a nudge only
write-good.Passive = suggestion

# Keep these loud
write-good.Cliches = warning
write-good.ThereIs = suggestion
proselint.Needless = warning
proselint.Hyperbole = warning
proselint.CorporateSpeak = warning
Vale.Repetition = error
proselint.Very = suggestion

# Duplicates of Vale.Repetition
write-good.Illusions = NO
